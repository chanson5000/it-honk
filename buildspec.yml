# AWS CodeBuild spec. `version` is the buildspec schema version, not the app version.
# Requires a CodeBuild image that supports Node.js 22 (e.g. aws/codebuild/amazonlinux-x86_64-standard:5.0).
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci
      - npm test
  build:
    commands:
      - npm run build

artifacts:
  base-directory: dist
  files:
    - '**/*'
